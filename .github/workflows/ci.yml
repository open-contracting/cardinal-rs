name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      # Prevent Git from changing LF to CRLF, which affects test fixtures.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      # https://github.com/Swatinem/rust-cache/issues/93#issuecomment-1321064841
      - run: cargo update
      - uses: taiki-e/install-action@cargo-llvm-cov
      - env:
          RUSTFLAGS: -Zon-broken-pipe=kill
        run: cargo llvm-cov --lcov --output-path coverage.lcov --no-cfg-coverage-nightly
      - if: matrix.os != 'windows-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .[test]
      - run: pytest -W error
  # Without `if: always()`, a failed `test` would skip `build`, and a skipped job satisfies a required status check.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
